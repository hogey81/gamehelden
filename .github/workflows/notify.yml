# Vercel Hobby only runs one cron a day, so this pings the notify endpoint every 10 minutes.
# Add two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://gamehelden.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as in Vercel
# GitHub may delay scheduled runs by a few minutes, and pauses them after 60 days without
# repository activity; push any commit to wake it up again.
name: Notify followers

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/notify
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/notify"
